name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  domain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm test
      - name: Check JavaScript syntax
        run: |
          for file in app/src/main/assets/web/*.js; do node --check "$file"; done
