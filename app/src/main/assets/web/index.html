<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://router.project-osrm.org; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <link rel="icon" type="image/svg+xml" href="logo-mark.svg" />
    <title>플레오더 · 가는 길에, 한 끼</title>
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a href="#" id="brand" class="brand" aria-label="플레오더 홈"></a>
        <nav aria-label="주문 방식">
          <button id="deliveryTab" class="nav-tab active" data-mode="delivery">
            배달</button
          ><button id="pickupTab" class="nav-tab" data-mode="pickup">
            픽업</button
          ><button id="ordersTab" class="nav-tab">
            주문 내역<span id="orderDot"></span>
          </button>
        </nav>
        <div class="header-tools">
          <span class="demo-label"><i></i> 주문 시뮬레이션</span
          ><button
            id="labButton"
            class="icon-button"
            aria-label="테스트 시나리오 열기"
          ></button>
        </div>
      </header>
      <main id="main" class="workspace">
        <section class="discovery">
          <div class="greeting">
            <p class="eyebrow">가는 길에, 한 끼</p>
            <h1 id="greeting">오늘 저녁, 뭐 먹을까요?</h1>
            <p id="intro" class="muted">
              집에 도착할 때쯤, 따뜻한 저녁도 도착하도록.
            </p>
          </div>
          <div class="choices-toolbar">
            <div
              id="categories"
              class="categories"
              aria-label="음식 종류"
            ></div>
            <button id="timingButton" class="timing-button"></button>
          </div>
          <div id="restaurantList" class="restaurant-list"></div>
        </section>
        <aside class="journey-panel">
          <div class="journey-top">
            <div>
              <span class="eyebrow">지금 가는 길</span>
              <h2 id="destinationName">우리 집으로</h2>
            </div>
            <button id="locationButton" class="subtle-button">데모 위치</button>
          </div>
          <div class="route-summary">
            <div>
              <span class="muted">현재 위치</span
              ><strong id="currentPlace">삼성역 인근</strong>
            </div>
            <div>
              <span class="muted">집까지 도로 거리</span
              ><strong id="homeDistance">경로 확인 중</strong>
            </div>
            <div>
              <span class="muted">모의 도착까지</span
              ><strong id="homeTime">24<span>분</span></strong>
            </div>
          </div>
          <div class="map-frame">
            <div
              id="map"
              role="img"
              aria-label="서울 실제 지도 위 가상 음식점과 귀가 경로"
            ></div>
            <div class="map-legend">
              <span><i class="legend-car"></i> 내 차</span
              ><span><i class="legend-store"></i> 가상 매장</span
              ><span><i class="legend-home"></i> 우리 집</span>
            </div>
            <div id="mapStatus" class="map-status">실제 지도 · 가상 매장</div>
            <button
              id="mapFit"
              class="map-fit icon-button"
              aria-label="전체 경로 보기"
            ></button>
          </div>
          <div id="journeyNote" class="journey-note"></div>
          <div id="orderPanel" class="order-panel"></div>
        </aside>
      </main>
      <footer class="voice-dock">
        <button
          id="micButton"
          class="mic-button"
          aria-label="음성으로 주문하기"
        ></button>
        <div class="voice-copy">
          <strong id="voiceTitle">말로 편하게 주문하세요</strong
          ><span id="voiceStatus">“비빔밥 한 개, 집으로 배달해 줘”</span>
        </div>
        <button id="textButton" class="text-button">문장으로 테스트</button
        ><button
          id="speakButton"
          class="icon-button"
          aria-label="현재 상태 읽어주기"
        ></button>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modalContent"></div></dialog>
    <div id="restriction" hidden>
      <h1>운전에 집중해 주세요</h1>
      <p>
        차량이 허용하는 음성 기능을 이용하거나 주차 후 화면을 이용해 주세요.
      </p>
    </div>
    <script src="vendor/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="payments.js"></script>
    <script src="core.js"></script>
    <script src="icons.js"></script>
    <script src="map.js"></script>
    <script src="service-ui.js"></script>
    <script src="app.js"></script>
  </body>
</html>
