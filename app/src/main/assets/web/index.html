<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; connect-src 'self' https://router.project-osrm.org https://photon.komoot.io; object-src 'none'; base-uri 'none'; frame-src 'none'"
    />
    <link rel="icon" href="logo-mark.png" type="image/png" />
    <title>플레오더</title>
    <link rel="stylesheet" href="vendor/leaflet.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="glass.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <a id="brand" class="brand" href="#" aria-label="플레오더 홈"></a>
        <nav id="primaryNav" aria-label="주문 방식">
          <button id="deliveryTab" class="nav-tab active">배달</button
          ><button id="pickupTab" class="nav-tab">픽업</button
          ><button id="ordersTab" class="nav-tab">
            주문 내역<span id="orderDot"></span>
          </button>
        </nav>
        <div class="header-tools">
          <span class="demo-label">DEMO</span
          ><button id="walletButton" class="wallet-button"></button>
          <button id="settingsButton" class="icon-button settings-button" aria-label="앱 설정"></button>
        </div>
      </header>
      <main class="workspace">
        <section class="discovery">
          <div class="discovery-title">
            <div>
              <p id="areaLabel">잠실동 · 집 주변</p>
              <h1 id="catalogTitle">가까운 맛집</h1>
            </div>
            <button id="addressButton" class="subtle-button"></button>
          </div>
          <button id="originButton" class="origin-chip" aria-label="출발 위치 변경"></button>
          <div id="scopeTabs" class="scope-tabs" aria-label="추천 지역"></div>
          <input id="storeSearch" class="field store-search" aria-label="음식 또는 가게 검색" placeholder="음식이나 가게를 찾아보세요" maxlength="80">
          <div id="categories" class="categories" aria-label="음식 종류"></div>
          <div
            id="recommendationBanner"
            class="recommendation-banner"
            hidden
          ></div>
          <div id="restaurantList" class="restaurant-list"></div>
        </section>
        <aside class="journey-panel">
          <div class="journey-top">
            <div>
              <span class="section-label" id="destinationLabel">배송지</span
              ><button id="destinationButton" class="destination-button">
                우리 집 · 잠실동
              </button>
            </div>
            <button id="timingButton" class="subtle-button"></button>
          </div>
          <div class="map-frame">
            <div
              id="map"
              role="img"
              aria-label="배송지 주변 지도와 주문 이동 경로"
            ></div>
            <div id="trackingHud" class="tracking-hud"></div>
            <div class="map-buttons">
              <button id="currentLocationButton"></button
              ><button id="homeLocationButton"></button>
            </div>
            <div id="mapStatus" class="map-status" hidden></div>
          </div>
          <div id="orderPanel" class="order-panel"></div>
        </aside>
      </main>
      <footer class="voice-dock">
        <button
          id="micButton"
          class="mic-button"
          aria-label="음성 주문 시작"
        ></button>
        <div class="voice-copy">
          <strong id="voiceTitle">이렇게 말해 보세요</strong
          ><span id="voiceStatus" aria-live="polite">“치킨 먹고 싶어”</span>
        </div>
        <button id="textButton" class="text-button">텍스트 입력</button
        ><button
          id="speakButton"
          class="icon-button"
          aria-label="주문 상태 읽어주기"
        ></button>
      </footer>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"><div id="modalContent"></div></dialog>
    <div id="restriction" role="status" hidden>
      <h1>주행 중에는 화면 조작이 제한돼요</h1>
      <p>Gleo를 불러 음성으로 주문하거나<br>주문 현황을 확인해 주세요.</p>
      <p class="restriction-note">화면은 안전하게 주차한 뒤 이용할 수 있어요.</p>
    </div>
    <script src="vendor/leaflet.js"></script>
    <script src="data.js"></script>
    <script src="real-catalog.js"></script>
    <script src="payments.js"></script>
    <script src="catalog.js"></script>
    <script src="core.js"></script><script src="location-search.js"></script><script src="voice-location.js"></script>
    <script src="checkout.js"></script>
    <script src="vendor/lucide-paths.js"></script>
    <script src="icons.js"></script>
    <script src="product-views.js"></script>
    <script src="ux-policy.js"></script>
    <script src="motion.js"></script>
    <script src="map.js"></script>
    <script src="place-picker.js"></script>
    <script src="boot.js"></script>
  </body>
</html>
