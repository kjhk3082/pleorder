<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'"
    />
  </head>
  <body>
    <script src="data.js"></script>
    <script src="payments.js"></script>
    <script src="core.js"></script>
    <script>
      function dispatch(name, params, state, id) {
        const repo = state
          ? PleorderCore.OrderRepository.restore(state)
          : new PleorderCore.OrderRepository();
        if (
          repo.simulation &&
          !repo.simulation.paused &&
          repo.simulation.savedWall
        )
          repo.advance(
            Math.min(
              1440,
              Math.max(
                0,
                ((Date.now() - repo.simulation.savedWall) *
                  (repo.simulation.rate || 10)) /
                  60000,
              ),
            ),
          );
        const previous = repo.orders.length;
        const r = repo.handleAction(name, params);
        repo.simulation = {
          paused:
            repo.orders.length > previous
              ? false
              : (repo.simulation?.paused ?? true),
          rate: repo.simulation?.rate || 10,
          savedWall: Date.now(),
        };
        const response = {
          status: r.status,
          message:
            r.status === "success"
              ? "The simulated food order action completed. Report the detailed order and payment state from the data."
              : r.status === "asking"
                ? "Ask the user for the missing details or confirmation. Relay the detailed payment state from the data."
                : "The action could not be completed. Explain the reason and available next step from the data.",
          data: JSON.stringify([
            {
              simulated: true,
              detail: r.voiceText || r.message,
              draftId: r.draft?.id,
              orderId: r.order?.id,
              fulfillment: r.draft?.mode || r.order?.mode,
              total: r.draft?.total || r.order?.total,
              payment: r.payment || r.order?.payment,
              stage: r.order?.stage,
            },
          ]),
        };
        Headless.complete(id, repo.serialize(), JSON.stringify(response));
      }
      Headless.ready();
    </script>
  </body>
</html>
