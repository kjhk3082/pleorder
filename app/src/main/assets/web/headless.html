<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline' https://oapi.map.naver.com https://maps.apigw.ntruss.com; connect-src 'self' https://oapi.map.naver.com https://maps.apigw.ntruss.com https://map.pstatic.net https://nrbe.pstatic.net https://photon.komoot.io"
    />
  </head>
  <body>
    <script src="data.js"></script>
    <script src="real-catalog.js"></script>
    <script src="payments.js"></script>
    <script src="catalog.js"></script>
    <script src="order-assistant.js"></script><script src="order-scheduler.js"></script><script src="core.js"></script><script src="map-sdk.js"></script><script src="location-search.js"></script><script src="voice-location.js"></script>
    <script>
      async function dispatch(name, params, state, id) {
        const repo = state
          ? PleorderCore.OrderRepository.restore(state)
          : new PleorderCore.OrderRepository();
        if(name === "TRACK_ORDERS_INTERNAL" && params.event) repo.observeNavigation(params.event);
        repo.guardTrackingGap();
        if (
          repo.simulation &&
          !repo.simulation.paused &&
          repo.simulation.savedWall
        )
          repo.advance(
            Math.min(
              1440,
              Math.max(
                0,
                ((Date.now() - repo.simulation.savedWall) *
                  (repo.simulation.rate || 10)) /
                  60000,
              ),
            ),
          );
        const previous = repo.orders.length;
        const r = name === "TRACK_ORDERS_INTERNAL" ? repo.status() : await PleorderVoice.dispatch(repo, name, params);
        repo.simulation = {
          paused:
            repo.orders.length > previous
              ? false
              : (repo.simulation?.paused ?? true),
          rate: repo.simulation?.rate || 10,
          savedWall: Date.now(),
        };
        const response = PleorderCore.gleoCallback(name, r);
        Headless.complete(id, repo.serialize(), JSON.stringify(response));
      }
      if (globalThis.PleorderRealCatalog) PleorderRealCatalog.ready.then(()=>Headless.ready());
      else Headless.ready();
    </script>
  </body>
</html>
