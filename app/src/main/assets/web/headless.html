<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' 'unsafe-inline'; connect-src 'self'"
    />
  </head>
  <body>
    <script src="data.js"></script>
    <script src="real-catalog.js"></script>
    <script src="payments.js"></script>
    <script src="catalog.js"></script>
    <script src="core.js"></script>
    <script>
      function dispatch(name, params, state, id) {
        const repo = state
          ? PleorderCore.OrderRepository.restore(state)
          : new PleorderCore.OrderRepository();
        if (
          repo.simulation &&
          !repo.simulation.paused &&
          repo.simulation.savedWall
        )
          repo.advance(
            Math.min(
              1440,
              Math.max(
                0,
                ((Date.now() - repo.simulation.savedWall) *
                  (repo.simulation.rate || 10)) /
                  60000,
              ),
            ),
          );
        const previous = repo.orders.length;
        const r = repo.handleAction(name, params);
        repo.simulation = {
          paused:
            repo.orders.length > previous
              ? false
              : (repo.simulation?.paused ?? true),
          rate: repo.simulation?.rate || 10,
          savedWall: Date.now(),
        };
        const response = PleorderCore.gleoCallback(name, r);
        Headless.complete(id, repo.serialize(), JSON.stringify(response));
      }
      if (globalThis.PleorderRealCatalog) PleorderRealCatalog.ready.then(()=>Headless.ready());
      else Headless.ready();
    </script>
  </body>
</html>
