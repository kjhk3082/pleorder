plugins { id 'com.android.application' }
android {
    namespace 'dev.pleorder.app'
    compileSdk 34
    defaultConfig { applicationId 'dev.pleorder.app'; minSdk 29; targetSdk 34; versionCode 3; versionName '0.2.1' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    // Contest release: public SpeechToText/TextToSpeech only. Existing Gleo
    // contracts remain available in debug for research, not competition claims.
    buildTypes {
        debug { manifestPlaceholders = [gleoExperimentalEnabled: 'true'] }
        release {
            debuggable false
            signingConfig signingConfigs.debug
            manifestPlaceholders = [gleoExperimentalEnabled: 'false']
        }
    }
}
dependencies {
    implementation 'ai.pleos.playground:SpeechToText:3.3.1'
    implementation 'ai.pleos.playground:TextToSpeech:3.3.1'
    implementation 'ai.pleos.playground:FusedLocation:1.1.3'
    implementation 'ai.pleos.playground:NaviHelper:3.0.5'
}
